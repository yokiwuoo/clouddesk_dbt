version: 2

models:
  - name: dim_accounts
    description: "客户主维度表，整合基础属性、活跃用户数及基于 MRR 划分的客户层级。"
    columns:
      - name: account_id
        description: "客户唯一主键；业务规则：每个企业账户在维度表中必须唯一且非空。"
        tests:
          - unique
          - not_null
      - name: account_tier
        description: "基于活跃 MRR 划分的客户分层；业务规则：仅允许 Enterprise、Mid-Market 或 SMB 三种枚举值。"
        tests:
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB']

  - name: fct_account_revenue_support
    description: "账户级营收与客服工单事实表。"
    columns:
      - name: account_id
        description: "关联 dim_accounts 的外键；业务规则：确保参照完整性，所有事实记录必须对应有效客户。"
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_accounts')
              field: account_id
